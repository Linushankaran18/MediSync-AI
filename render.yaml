services:
  - type: web
    name: medisync-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: cloud
      - key: CLOUD_LLM_URL
        value: https://api.groq.com/openai/v1
      - key: CLOUD_LLM_API_KEY
        sync: false
      - key: CLOUD_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: CHROMA_PATH
        value: /app/data/chroma
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: medisync-data
      mountPath: /app/data
      sizeGB: 1
